[package]
name = "razer-taskbar"
version = "0.1.0"
edition = "2021"

[dependencies]
# System Tray
tray-icon = "0.21.3"
image = "0.25.9"
imageproc = "0.26.0"
ab_glyph = "0.2"

# File Watching
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Regex & Parsing
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"

# Error handling
anyhow = "1.0"

# Utilities
chrono = "0.4"
dirs = "6.0.0"

# Windows
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
]}
winreg = "0.55.0"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols

[build-dependencies]
winres = "0.1.12"
